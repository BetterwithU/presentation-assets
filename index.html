<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation Assets — 시각 자산 갤러리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    background: #0f0f12;
    color: #e5e7eb;
    padding: 32px 20px 60px;
    line-height: 1.5;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 { font-size: 24px; color: #f9fafb; margin-bottom: 8px; letter-spacing: -0.4px; }
  header p { font-size: 13px; color: #9ca3af; }

  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid #27272a;
    margin-bottom: 24px;
  }
  .tab {
    background: transparent; border: none; color: #9ca3af;
    font-size: 14px; font-weight: 500; padding: 10px 16px;
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.15s; font-family: inherit;
  }
  .tab:hover { color: #e5e7eb; }
  .tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }

  .panel { display: none; }
  .panel.active { display: block; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }
  .card {
    background: #17171b; border: 1px solid #27272a; border-radius: 10px;
    overflow: hidden; text-decoration: none; color: inherit;
    transition: border-color 0.15s, transform 0.15s;
    display: block;
  }
  .card:hover { border-color: #60a5fa; transform: translateY(-2px); }
  .card img {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    display: block; background: #0b0b0e;
  }
  .card-body { padding: 10px 12px; }
  .card-title { font-size: 14px; font-weight: 600; color: #f3f4f6; }
  .card-sub { font-size: 12px; color: #8b8f98; margin-top: 2px; }

  .note {
    font-size: 12px; color: #8b8f98; margin-bottom: 18px;
    background: #17171b; border: 1px solid #27272a;
    border-radius: 8px; padding: 10px 13px;
  }
  .note code {
    background: #0b0b0e; border: 1px solid #27272a; border-radius: 4px;
    padding: 1px 5px; font-size: 11px; color: #cbd5e1;
  }

  footer {
    margin-top: 48px; padding-top: 18px; border-top: 1px solid #27272a;
    font-size: 12px; color: #6b7280; text-align: center;
  }
  footer a { color: #60a5fa; text-decoration: none; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Presentation Assets</h1>
    <p>프레젠테이션 마스터 프로젝트의 시각 자산 모음 · 프리셋 17종 · 스타일 라이브러리 26종</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="presets">프리셋 (17)</button>
    <button class="tab" data-panel="styles">스타일 라이브러리 (26)</button>
  </div>

  <div class="panel active" id="presets">
    <div class="note">
      각 프리셋은 <code>1_cover</code> · <code>2_section</code> · <code>3_body</code> ·
      <code>4_data</code> · <code>5_process</code> · <code>6_ending</code> 6장 구성.
      카드를 누르면 해당 프리셋의 전체 미리보기가 열립니다.
    </div>
    <div class="grid" id="preset-grid"></div>
  </div>

  <div class="panel" id="styles">
    <div class="note">
      PDF에서 추출한 스타일 참고 이미지. 각 항목은 <code>p1</code> · <code>p2</code> ·
      <code>p3</code> · <code>p5</code> 4장 구성. 카드를 누르면 표지 원본이 열립니다.
    </div>
    <div class="grid" id="style-grid"></div>
  </div>

  <footer>
    <a href="https://github.com/BetterwithU/presentation-assets">GitHub 레포 보기</a>
  </footer>

</div>

<script>
  const PRESETS = ["A","B","C","D","E","F","G1","H","I","J","K1","K2","L","M","N1","N2","N3"];
  const STYLES = Array.from({length: 26}, (_, i) => 51 + i);

  document.getElementById("preset-grid").innerHTML = PRESETS.map(p => `
    <a class="card" href="artifacts/preset_${p}.html">
      <img src="presets/preset_${p}/1_cover.png" alt="프리셋 ${p} 표지" loading="lazy">
      <div class="card-body">
        <div class="card-title">프리셋 ${p}</div>
        <div class="card-sub">슬라이드 6종</div>
      </div>
    </a>`).join("");

  document.getElementById("style-grid").innerHTML = STYLES.map(n => `
    <a class="card" href="style_library/${n}/p1.png">
      <img src="style_library/${n}/p1.png" alt="스타일 ${n} 표지" loading="lazy">
      <div class="card-body">
        <div class="card-title">스타일 ${n}</div>
        <div class="card-sub">페이지 4종</div>
      </div>
    </a>`).join("");

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.panel).classList.add("active");
    });
  });
</script>

</body>
</html>
